name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Restore debug.keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Restore google-services.json from Secret
        env:
          GS_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if echo "$GS_SECRET" | grep -q '"project_info"'; then
            printf '%s' "$GS_SECRET" > app/google-services.json
          else
            printf '%s' "$GS_SECRET" | tr -d '\n\r ' | base64 -d > app/google-services.json
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK v2.0
        uses: actions/upload-artifact@v4
        with:
          name: Lich-TKB-LHL-v2.0-APK
          path: app/build/outputs/apk/debug/app-debug.apk
