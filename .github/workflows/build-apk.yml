name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore and verify google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "LOI: Chua tim thay Repository Secret ten GOOGLE_SERVICES_JSON!"
            exit 1
          fi
          printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          grep -q "tkbthcslhl-2026" app/google-services.json || { echo "LOI: Noi dung secret khong phai du an tkbthcslhl-2026!"; exit 1; }
          grep -q "com.aistudio.tkblhl.vn26ab" app/google-services.json || { echo "LOI: package_name trong secret khong khop com.aistudio.tkblhl.vn26ab!"; exit 1; }
          echo "OK: Da tao app/google-services.json hop le."

      - name: Create debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-build-cache

      - name: Verify Firebase config in APK
        run: |
          VALUES_FILE="app/build/generated/res/processDebugGoogleServices/values/values.xml"
          if [ ! -f "$VALUES_FILE" ]; then
            echo "LOI: Gradle khong doc duoc app/google-services.json!"
            exit 1
          fi
          grep -q "tkbthcslhl-2026" "$VALUES_FILE" || { echo "LOI: Thieu project_id tkbthcslhl-2026 trong APK!"; exit 1; }
          grep -q "google_app_id" "$VALUES_FILE" || { echo "LOI: Thieu google_app_id trong APK!"; exit 1; }
          cp app/build/outputs/apk/debug/app-debug.apk "Lich-TKBLHL-build-${{ github.run_number }}.apk"
          echo "OK: APK da tich hop day du Firebase tkbthcslhl-2026."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lich-TKBLHL-build-${{ github.run_number }}
          path: Lich-TKBLHL-build-${{ github.run_number }}.apk
